services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: hatter
      DB_PASSWORD: whitehat
      DB_NAME: whitehat
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_DATABASE: whitehat
      MARIADB_USER: hatter
      MARIADB_PASSWORD: whitehat
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro,Z

volumes:
  db_data:
